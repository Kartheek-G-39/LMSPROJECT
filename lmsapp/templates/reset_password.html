{% extends 'base.html' %}
{% load static %}
{% block title %}Reset Password{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/reset_password.css' %}">
{% endblock %}

{% block content %}
<div class="container">
    <div class="reset-password-container">
        <div class="reset-password-image">
            <img src="{% static 'img/reset_password.svg' %}" alt="Reset Password Image">
        </div>
        <form action="{% url 'reset_password' %}" method="post" id="resetPasswordForm">
            {% csrf_token %}
            <div class="form-group" id="resetEmailField">
                <label for="resetEmailInput">Enter Your Email</label>
                <input type="email" class="form-control" id="resetEmailInput" name="email" placeholder="Enter Your Email" autocomplete="off">
                <button type="button" class="btn btn-primary mt-3" onclick="sendResetOTP()" id="sendResetOTPButton">Send OTP</button>
            </div>
            <div class="form-group hidden" id="otpField" style="display: none;">
                <label for="resetOtpInput">Enter OTP</label>
                <input type="text" class="form-control" id="resetOtpInput" name="otp" placeholder="Enter OTP">
                <button type="button" class="btn btn-primary mt-3" id="verifyResetOtpButton">Verify OTP</button>
            </div>
            <div id="newPasswordDiv" style="display: none;">
                <div class="form-group hidden" id="newPasswordField">
                    <label for="newPasswordInput">New Password</label>
                    <input type="password" class="form-control" id="newPasswordInput" name="password" placeholder="Enter New Password">
                </div>
                <div class="form-group hidden" id="confirmNewPasswordField">
                    <label for="confirmNewPasswordInput">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmNewPasswordInput" name="confirm_password" placeholder="Confirm New Password">
                    <button type="button" onclick="validateNewPassword()" class="btn btn-primary mt-3" id="resetSubmitButton">Submit</button>
                </div>
            </div>
        </form>
    </div>
</div>
<script src="{% static 'js/reset_password.js' %}"></script>
{% endblock %}

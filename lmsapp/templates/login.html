{% extends 'base.html' %}
{% load static %}
{% block title %}Login Page{% endblock %}
{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}

{% block content %}
{% if user.is_authenticated %}
  <script>
    window.location.href = "{% url 'home' %}";  // Replace 'home' with your home URL name
  </script>
{% endif %}
<script src="{% static 'js/signup.js' %}"></script>
<div class="container">
    <div class="row">
        <div class="col-md-6">
            <img src="{% static 'img/login_user.svg' %}" alt="Login User Image" class="login-user-img">
        </div>
        <div class="col-md-6">
            <form class="login-form" action="" method="post">
                <img src="{% static 'img/id-cards.svg' %}" alt="ID Cards Image" class="id-cards-image">
                {% csrf_token %}
                {% if error %}
                    <div class="alert alert-danger" role="alert">
                    {{ error }}
                    </div>
                {% endif %}
                <div class="form-group">
                    <label for="floatingInput">Email address</label>
                    <input type="email" class="form-control" id="floatingInput" name="mail" value="{{ email }}" oninput="handleInput_loginpage(this)" maxlength="19" placeholder="Enter your Roll Number" required>
                </div>
                <div class="form-group">
                    <label for="floatingPassword">Password</label>
                    <input type="password" class="form-control" id="floatingPassword" name="pass" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
                <div class="mt-3 text-center">
                    <a href="{% url 'forgot' %}">Forgot Password?</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

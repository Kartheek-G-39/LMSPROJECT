{% extends 'base.html' %}
{% load static %}
{% block title %}Signup Page{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/signup.css' %}">
{% endblock %}

{% block content %}
<div class="container">
    <div class="signup-container">
        <div class="signup-image">
            <img src="{% static 'img/login_user.svg' %}" alt="Signup User Image">
        </div>
        <form action="" method="post" id="signupForm">
            {% csrf_token %}
            <img src="{% static 'img/id-cards.svg' %}" alt="ID Cards Image" class="id-cards-image">
            <div class="form-group" id="rollNumberField">
                <label for="rollNumberInput">Enter Registered No.</label>
                <input type="text" oninput="handleInput(this)" maxlength="19" class="form-control" id="rollNumberInput" name="roll_number" placeholder="Enter Roll Number" autocomplete="off">
                <button type="button" class="btn btn-primary mt-3" onclick="sendOTP()" id="sendOTPButton" style="display: none;">Send OTP</button>
            </div>
            <div class="form-group hidden" id="otpField" style="display: none;">
                <label for="otpInput">Enter OTP</label>
                <input type="text" class="form-control" id="otpInput" name="otp" placeholder="Enter OTP">
                <button type="button" class="btn btn-primary mt-3" id="verifyOTPButton">Verify OTP</button>
            </div>
            <div id="passwordDiv" style="display: none;">
                <div class="form-group hidden" id="passwordField">
                    <label for="passwordInput">New Password</label>
                    <input type="password" class="form-control" id="passwordInput" name="password" placeholder="Enter New Password">
                </div>
                <div class="form-group hidden" id="confirmPasswordField">
                    <label for="confirmPasswordInput">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPasswordInput" name="confirm_password" placeholder="Confirm New Password">
                    <button type="button" onclick="validate()" class="btn btn-primary mt-3" id="submitButton">Submit</button>
                </div>
            </div>
        </form>
    </div>
</div>
<script src="{% static 'js/signup.js' %}"></script>
{% endblock %}
